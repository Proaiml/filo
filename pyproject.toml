[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filo"
version = "0.1.0"
description = "Sunucu ve runbook otomasyonu adminlik işlerini yapay zekâ ajanına yaptıran, modelden bağımsız harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
filo = "filo.__main__:ana"

[tool.setuptools]
packages = ["filo", "filo.bench"]

[tool.setuptools.package-data]
filo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: Docker laboratuvarı ister; laboratuvar yoksa atlanır"]
